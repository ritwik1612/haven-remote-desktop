name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-native/**'
      - 'scripts/build-ios.py'
      - 'tests/ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test address and QR validation
        run: |
          mkdir -p .build
          xcrun swiftc ios-native/Haven/HostAddress.swift tests/ios/main.swift -o .build/ios-address-tests
          .build/ios-address-tests
      - name: Build unsigned iPhone and iPad IPA
        run: python3 scripts/build-ios.py
      - name: Build simulator and check launch
        run: |
          xcodebuild -project ios-native/Haven.xcodeproj -scheme Haven -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" .build/ios-simulator/Build/Products/Debug-iphonesimulator/Haven.app
          xcrun simctl launch "$DEVICE" app.haven.remote
          sleep 3
          xcrun simctl io "$DEVICE" screenshot downloads/Haven-iOS-preview.png
          xcrun simctl terminate "$DEVICE" app.haven.remote
      - name: Upload unsigned app and launch preview
        uses: actions/upload-artifact@v4
        with:
          name: Haven-iOS-unsigned
          path: |
            downloads/Haven-iOS-unsigned.ipa
            downloads/iOS-SHA256SUMS.txt
            downloads/Haven-iOS-preview.png
          if-no-files-found: error
          retention-days: 14
